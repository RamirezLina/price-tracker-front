<div class="w-full">
  <label [for]="selectId" class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-700">
    {{ label() }}
  </label>

  <div class="relative">
    <select [id]="selectId" [name]="controlName()" [value]="value()" (change)="onChange($event)"
      class="w-full cursor-pointer appearance-none rounded-lg border-2 border-purple-400 bg-purple-50 px-4 py-2 pr-10 text-sm text-slate-800 outline-none transition focus:border-purple-600 focus:ring-2 focus:ring-purple-200">
      @if (placeholder()) {
      <option value="" disabled>
        {{ placeholder() }}
      </option>
      }

      @for (option of options(); track option.value) {
      <option [value]="option.value" [disabled]="option.disabled">
        {{ option.label }}
      </option>
      }
    </select>

    <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-purple-600">
      ▾
    </span>
  </div>
</div>
